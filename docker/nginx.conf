server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        image/svg+xml;

    # API + health proxied to the Go server; same-origin, so no CORS in prod.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://api:8080;
    }

    # Hashed build assets are immutable — cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # yamabiko-platform, same VM/nginx, same public origin (see BUILD_STATE.md
    # for the full decision) — core-api reached over the shared_net Docker
    # network by service name, never published on the host. Trailing slash on
    # proxy_pass strips the /yamabiko-api/ prefix so core-api sees its normal
    # unprefixed routes (e.g. /yamabiko-api/auth/login -> core-api:8080/auth/login).
    location /yamabiko-api/ {
        proxy_pass http://core-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # yamabiko-platform frontend static build, published by its own
    # web-static one-shot container into the yamabiko_web_dist volume
    # mounted read-only at /usr/share/nginx/html/yamabiko (see
    # docker-compose.yml). Inherits `root` from above, so this resolves
    # against the same mount. SPA fallback mirrors location / below, scoped
    # to this subpath.
    location /yamabiko/ {
        try_files $uri $uri/ /yamabiko/index.html;
    }

    # SPA fallback: every unknown path serves index.html for client routing.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
