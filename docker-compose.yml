services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
      API_ADDR: 0.0.0.0:8080
      DEV_FAKE_EMAIL: ${DEV_FAKE_EMAIL:-}
      SUBMIT_RATE_LIMIT: ${SUBMIT_RATE_LIMIT:-10}
      SUBMIT_RATE_WINDOW_S: ${SUBMIT_RATE_WINDOW_S:-60}
    ports:
      - "9001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - default
      - shared-services

  # Sandbox image for SQL challenges: not a long-running service, just a
  # build target so `docker compose build sqlite` tags ascend-sqlite:latest
  # for the judge to launch as a sibling container (see executor.go). The
  # build-only profile keeps `docker compose up` from starting it.
  sqlite:
    build:
      context: .
      dockerfile: docker/sqlite.Dockerfile
    image: ascend-sqlite:latest
    profiles: ["build-only"]
    command: ["true"]

  # Sandbox image for C/C++ challenges — same build-only shape as sqlite
  # above, tags ascend-cpp:latest for the judge to launch as a sibling
  # container (see executor.go).
  cpp:
    build:
      context: .
      dockerfile: docker/cpp.Dockerfile
    image: ascend-cpp:latest
    profiles: ["build-only"]
    command: ["true"]

  judge:
    build:
      context: .
      dockerfile: judge/Dockerfile
    environment:
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Same-origin: browser calls /api/... and nginx proxies to the api
        # service, so production needs no CORS.
        VITE_API_URL: "/ascend/api"
    ports:
      - "8000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    # Listing `networks:` here means this service no longer joins the
    # compose-generated default network implicitly — `default` is named
    # explicitly below so it still reaches `api` exactly as before.
    # `shared-services` (external, see bottom of file) is the only new
    # thing: it's how this container's nginx reaches the yamabiko-platform
    # core-api (yamabiko/docker-compose.prod.yml joins the same external
    # network), without publishing any yamabiko port on the host and
    # without asking Pangolin to route anything new — same publicly-exposed
    # 8000:80 as before, nginx just gained two new location blocks (see
    # docker/nginx.conf).
    networks:
      default:
      shared-services:
    # Static build output of the yamabiko frontend, published by the
    # yamabiko-platform `web-static` one-shot service into this same
    # external volume — read-only here since this container only serves it,
    # never writes it. Re-running that publisher on the yamabiko side is
    # enough to update /yamabiko/ content; this container never needs a
    # rebuild for a yamabiko-only frontend change, only for a nginx.conf
    # change (which IS baked into the image at build time).
    volumes:
      - yamabiko_web_dist:/usr/share/nginx/html/yamabiko:ro

volumes:
  postgres_data:
  # External: created once (`docker volume create yamabiko_web_dist`) and
  # shared across the ascend and yamabiko-platform compose projects — see
  # yamabiko/docker-compose.prod.yml and BUILD_STATE.md in both repos.
  yamabiko_web_dist:
    external: true

networks:
  # External: pre-existing network on this VM (see `docker network ls`) so
  # ascend's `web` (nginx) container and yamabiko-platform's `core-api`
  # container can reach each other by service name, without either compose
  # project's internal services (postgres, redis, judge, yamabiko's own
  # postgres, etc.) being exposed to one another or to the host. See
  # BUILD_STATE.md for the full same-origin architecture decision.
  shared-services:
    external: true