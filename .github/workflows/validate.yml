name: Validate Ascend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            go.sum
            api/go.sum
            judge/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Unit tests
        run: |
          timeout -k 2s 58s go list ./cmd/... ./api/... ./judge/... ./pkg/... > /tmp/ascend-go-packages.txt
          while IFS= read -r package; do
            timeout -k 2s 58s go test -p 1 -timeout 45s "$package"
          done < /tmp/ascend-go-packages.txt
      - name: Disposable PostgreSQL (rootless Podman)
        run: |
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          podman run -d --name ascend-validation-db \
            -e POSTGRES_USER=ascend_test -e POSTGRES_PASSWORD=local_disposable_only \
            -e POSTGRES_DB=ascend_test -p 127.0.0.1:55439:5432 \
            docker.io/library/postgres:16-alpine
          for i in $(seq 1 30); do
            # The image uses a temporary Unix-socket server during init; wait for TCP.
            if podman exec ascend-validation-db pg_isready -h 127.0.0.1 -U ascend_test -d ascend_test; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Judge isolation and lifecycle (private rootless Podman)
        run: |
          podman pull docker.io/library/python:3.11-alpine
          podman build -f docker/fastapi.Dockerfile -t ascend-fastapi:latest .
          for scenario in TestExecutorPodman TestHTTPLabPodman TestHTTPSequencePodman; do
            ASCEND_TEST_PODMAN=1 timeout -k 2s 58s go test -race -timeout 45s -tags integration ./judge/internal/worker -run "^${scenario}$"
          done
      - name: Dashboard and history integration and permissions
        env:
          DATABASE_URL: postgres://ascend_test:local_disposable_only@127.0.0.1:55439/ascend_test?sslmode=disable
        run: |
          go run ./cmd/migrate up
          for package in ./api/internal/store ./api/internal/handler ./api/internal/router; do
            timeout -k 2s 58s go test -race -timeout 45s -tags integration "$package" -run 'TestTeacherStudentsOverview|TestStudentsOverview|TestPedagogicalDashboard|TestLiveSessionHistory|TestListAssessments|TestHTTPSequenceImport'
          done
      - name: HTTP labs mentor/student with real Judge (private rootless Podman)
        env:
          DATABASE_URL: postgres://ascend_test:local_disposable_only@127.0.0.1:55439/ascend_test?sslmode=disable
          REDIS_ADDR: 127.0.0.1:55440
          SANDBOX_CLI: podman
          ASCEND_HTTP_LAB_REDIS_ADDR: 127.0.0.1:55440
        run: |
          podman run -d --name ascend-validation-redis -p 127.0.0.1:55440:6379 docker.io/library/redis:7-alpine
          for i in $(seq 1 30); do
            if podman exec ascend-validation-redis redis-cli ping; then break; fi
            sleep 1
          done
          go build -o /tmp/ascend-validation-judge ./judge/cmd/worker
          /tmp/ascend-validation-judge > /tmp/ascend-validation-judge.log 2>&1 &
          lab_judge_pid=$!
          trap 'kill "$lab_judge_pid" 2>/dev/null || true; wait "$lab_judge_pid" 2>/dev/null || true' EXIT
          timeout -k 2s 58s go test -race -timeout 45s -tags integration ./api/internal/router -run '^TestHTTPLabs$' -v
      - name: Frontend tests, lint and build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
      - name: HTTP laboratories in real Chromium (mentor to student)
        env:
          DATABASE_URL: postgres://ascend_test:local_disposable_only@127.0.0.1:55439/ascend_test?sslmode=disable
          REDIS_URL: redis://127.0.0.1:55440
          REDIS_ADDR: 127.0.0.1:55440
          SANDBOX_CLI: podman
          API_ADDR: 127.0.0.1:58081
          DEV_FAKE_EMAIL: http-browser-ci@example.test
          SUBMIT_RATE_LIMIT: 100
          ASCEND_HTTP_BROWSER_BASE: http://127.0.0.1:58001/ascend
        run: |
          timeout -k 2s 180s npx --prefix web playwright install --with-deps chromium
          timeout -k 2s 58s go build -o /tmp/ascend-browser-api ./api/cmd/server
          /tmp/ascend-browser-api > /tmp/ascend-browser-api.log 2>&1 &
          browser_api_pid=$!
          /tmp/ascend-validation-judge > /tmp/ascend-browser-judge.log 2>&1 &
          browser_judge_pid=$!
          (cd web && exec env VITE_API_URL='' VITE_API_TARGET=http://127.0.0.1:58081 ./node_modules/.bin/vite --port 58001 --host 127.0.0.1) > /tmp/ascend-browser-web.log 2>&1 &
          browser_web_pid=$!
          trap 'kill "$browser_api_pid" "$browser_judge_pid" "$browser_web_pid" 2>/dev/null || true; wait || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:58081/api/v1/auth/me > /dev/null; then break; fi
            sleep 1
          done
          podman exec ascend-validation-db psql -U ascend_test -d ascend_test -v ON_ERROR_STOP=1 -c "UPDATE users SET role='teacher' WHERE email='http-browser-ci@example.test'"
          timeout -k 2s 300s node web/tests/http-labs-browser.mjs
          timeout -k 2s 20s python3 -m unittest discover -s scripts -p 'test_populate_http_labs.py'
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-labs-browser
          path: /tmp/ascend-http-browser
          if-no-files-found: ignore
      - name: Remove disposable database
        if: always()
        run: podman rm -f ascend-validation-db ascend-validation-redis || true
